name: similar-code

on:
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  similar-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
          cache: "false"
      - id: model
        run: echo "revision=$(vp exec fallow similar-code status --format json | jq -r .model_revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fallow/similar-code/models
          key: fallow-similar-code-model-${{ steps.model.outputs.revision }}
      - run: vp exec fallow similar-code setup --local --yes --quiet
      - run: vp exec fallow similar-code --format json --quiet > "$RUNNER_TEMP/similar-code.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: similar-code
          path: ${{ runner.temp }}/similar-code.json
