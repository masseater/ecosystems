name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}
  VP_REMOTE_CACHE: ${{ github.event_name == 'schedule' && 'off' || 'read-write' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: verify-${{ github.ref }}
    env:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pnpm/v12
          key: pnpm-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pnpm-metadata-
      - uses: $/.github/actions/setup
        with:
          session-path: "true"
          rust-cache: "false"
          sccache: "true"
          telemetry: "true"
      - if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/msch
          key: msch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: msch-
      - uses: masseater/typescript-template/.github/actions/verify@c116d175574f2f6917e2aa39caf83a141ef4bd94
        timeout-minutes: 30
        with:
          github-token: ${{ github.token }}
          full-history: "true"
      - if: always()
        uses: $/.github/actions/telemetry-files
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/msch
          key: msch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

  compat-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      directories: ${{ steps.plan.outputs.directories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - id: plan
        run: vp exec msch-publish compat-plan .

  compat:
    needs: compat-plan
    name: compat (${{ matrix.directory }})
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.compat-plan.outputs.directories) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-cache: "false"
          sccache: "true"
      - run: vp exec msch-publish compat "$DIRECTORY"
        env:
          DIRECTORY: ${{ matrix.directory }}

  wake:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-cache: "false"
      - run: vp exec msch-wake

  ci-telemetry:
    needs: [verify, wake]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@c116d175574f2f6917e2aa39caf83a141ef4bd94
        with:
          github-token: ${{ github.token }}
